<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Payment</title>

<style>

body{
background:#f3f3f3;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#fff;
padding:40px;
border-radius:10px;
text-align:center;
width:400px;
}

.amount{
font-size:30px;
font-weight:bold;
margin:20px 0;
}

.qr-img{
width:300px;
height:auto;
border-radius:10px;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#160042;
color:#fff;
border:none;
font-size:18px;
font-weight:bold;
border-radius:5px;
cursor:pointer;
}

.success{
margin-top:20px;
color:green;
font-weight:bold;
display:none;
}

</style>
</head>

<body>

<div class="box">

<h2>Scan QR & Pay</h2>

<div class="amount" id="amount"></div>

<img src="yourqr.jpg" class="qr-img">

<input type="text" placeholder="Enter UTR Number">

<input type="file">

<button onclick="showSuccess()">
Submit Payment
</button>

<div class="success" id="successMsg">
Payment Submitted Successfully
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const amount = params.get("amount");

document.getElementById("amount").innerHTML = "Amount: ₹" + amount;

function showSuccess(){
document.getElementById("successMsg").style.display = "block";
}

</script>

</body>
</html>
