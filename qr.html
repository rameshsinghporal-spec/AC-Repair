<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Payment</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:#f3f3f3;
}

.top{
background:#061b2d;
padding:25px;
color:#fff;
font-size:30px;
font-weight:bold;
}

.green{
background:green;
padding:10px;
text-align:center;
color:#fff;
font-weight:bold;
}

.container{
width:90%;
max-width:700px;
margin:auto;
background:#fff;
padding:40px;
margin-top:50px;
border-radius:10px;
text-align:center;
}

h1{
font-size:40px;
margin-bottom:20px;
}

.amount{
font-size:35px;
color:#160042;
font-weight:bold;
margin-bottom:30px;
}

.qr{
width:320px;
max-width:100%;
margin-bottom:30px;
}

input{
width:100%;
padding:15px;
font-size:18px;
margin-top:15px;
border:1px solid #ccc;
}

button{
background:#160042;
color:#fff;
border:none;
padding:18px;
font-size:22px;
margin-top:25px;
width:100%;
cursor:pointer;
}

.success{
display:none;
margin-top:25px;
color:green;
font-size:24px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="top">
FOOD LICENSE
</div>

<div class="green">
Scan QR And Complete Payment
</div>

<div class="container">

<h1>Scan & Pay</h1>

<div class="amount" id="amount">
</div>

<img src="qr.jpeg" class="qr">

<input type="text" placeholder="Enter UTR Number">

<input type="file">

<button onclick="showMsg()">
Submit Payment
</button>

<div class="success" id="success">
Payment Details Submitted Successfully
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const amount = params.get("amount");

document.getElementById("amount").innerHTML =
"Amount : ₹" + amount;

function showMsg(){

document.getElementById("success").style.display = "block";

}

</script>

</body>
</html>
