<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f3f3f3;
}

.payment-box{
max-width:1200px;
margin:60px auto;
background:#fff;
padding:50px;
text-align:center;
}

h1{
font-size:40px;
margin-bottom:40px;
color:#160042;
}

.plan-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:20px;
margin-top:40px;
}

.plan{
background:#fff;
border:2px solid #f39a3c;
padding:20px;
}

.plan h2{
font-size:24px;
margin-bottom:10px;
}

.plan p{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#160042;
}

.pay-btn{
display:inline-block;
background:#f39a3c;
color:#000;
padding:14px 30px;
text-decoration:none;
font-weight:700;
border-radius:4px;
}

.note{
margin-top:50px;
font-size:20px;
font-weight:600;
color:red;
}

@media(max-width:992px){

.plan-grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="payment-box">

<h1>Please Pay Below And Proceed</h1>

<div class="plan-grid">

<div class="plan">
<h2>1 Year</h2>
<p>₹999</p>
<a href="qr.html" class="pay-btn">Pay Now</a>
</div>

<div class="plan">
<h2>2 Year</h2>
<p>₹1399</p>
<a href="qr.html" class="pay-btn">Pay Now</a>
</div>

<div class="plan">
<h2>3 Year</h2>
<p>₹1599</p>
<a href="qr.html" class="pay-btn">Pay Now</a>
</div>

<div class="plan">
<h2>4 Year</h2>
<p>₹1799</p>
<a href="qr.html" class="pay-btn">Pay Now</a>
</div>

<div class="plan">
<h2>5 Year</h2>
<p>₹1999</p>
<a href="qr.html" class="pay-btn">Pay Now</a>
</div>

</div>

<div class="note">
IMPORTANT: Complete payment to proceed further.
</div>

</div>

</body>
</html>
