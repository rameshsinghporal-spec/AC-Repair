<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scan & Pay</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.payment-box{
background:#fff;
padding:40px;
max-width:500px;
width:100%;
text-align:center;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.payment-box h1{
font-size:38px;
margin-bottom:10px;
color:#160042;
}

.payment-box p{
font-size:18px;
margin-bottom:25px;
color:#444;
}

.qr{
width:300px;
height:300px;
object-fit:cover;
border:6px solid #160042;
padding:10px;
border-radius:10px;
background:#fff;
}

.amount{
margin-top:20px;
font-size:28px;
font-weight:700;
color:#f39a3c;
}

.note{
margin-top:25px;
font-size:15px;
line-height:1.8;
color:#555;
}

button{
margin-top:30px;
background:#f39a3c;
border:none;
padding:15px 30px;
font-size:18px;
font-weight:700;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#160042;
color:#fff;
}

</style>

</head>

<body>

<div class="payment-box">

<h1>Scan & Pay</h1>

<p>
Scan QR Code Using Any UPI App
</p>

<!-- Yaha apna QR PNG lagana -->

<img src="qr.png" class="qr">

<div class="amount">
₹999
</div>

<div class="note">

After successful payment kindly take screenshot and
share payment reference number with support team.

</div>

<button onclick="window.location.href='index.html'">
Back To Home
</button>

</div>

</body>
</html>
